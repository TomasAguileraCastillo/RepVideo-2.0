<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema | HEP - UDOP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* Paleta de Salud REPLICADA EXACTAMENTE */
        :root {
            --health-primary: #004c99;
            /* Azul más profundo y profesional */
            --health-secondary: #28a745;
            /* Verde de éxito/vida */
            --health-light: #e6f0ff;
            /* Azul muy claro para fondos sutiles */
        }

        .bg-health-primary {
            background-color: var(--health-primary) !important;
        }

        .text-health-primary {
            color: var(--health-primary) !important;
        }

        /* Estilo de Botón REPLICADO EXACTAMENTE */
        .btn-health {
            background-color: var(--health-primary);
            color: white;
            border-color: var(--health-primary);
            transition: all 0.2s ease-in-out;
        }

        .btn-health:hover {
            background-color: #003366;
            border-color: #003366;
            box-shadow: 0 4px 8px rgba(0, 76, 153, 0.4);
        }

        /* Estilos Generales y Tipografía (Fondo Centrado) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--health-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Estilo de Tarjeta de Formulario REPLICADO EXACTAMENTE */
        .login-card {
            width: 100%;
            max-width: 400px;
            background-color: #ffffff;
            border-radius: 1.25rem;
            /* 20px */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 2.5rem;
            /* 40px */
            text-align: center;
        }

        /* Títulos */
        .main-title {
            color: var(--health-primary);
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .sub-title {
            color: #6c757d;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        /* Inputs */
        .form-control:focus {
            border-color: var(--health-primary);
            box-shadow: 0 0 0 0.25rem rgba(0, 76, 153, 0.25);
            /* Sombra de foco con color primario */
        }

        /* Enlaces de Ayuda */
        .text-link-health {
            color: var(--health-primary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .text-link-health:hover {
            color: #003366;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <i class="bi bi-hospital-fill text-health-primary mb-3" style="font-size: 3rem;"></i>

        <h1 class="main-title">Acceso al Sistema</h1>
        <p class="sub-title">Hospital de Especialidades (HEP)</p>

        <form id="loginForm" novalidate>

            <div class="mb-4 text-start">
                <label for="usuario" class="form-label fw-bold">Usuario / RUT</label>
                <input type="text" id="usuario" name="usuario" class="form-control" required
                    placeholder="Ingrese su usuario o RUT (Ej: 12.345.678-9)">
                <div class="invalid-feedback">Por favor ingrese su usuario o un RUT válido.</div>
            </div>

            <div class="mb-4 text-start">
                <label for="contrasena" class="form-label fw-bold">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" class="form-control" required
                    placeholder="••••••••">
                <div class="invalid-feedback">La contraseña es obligatoria.</div>
            </div>

            <button type="submit" class="btn btn-health btn-lg w-100 shadow-sm mt-3">
                <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
            </button>

            <a href="#" class="text-link-health small mt-3 d-block"
                onclick="alert('Funcionalidad de Recuperación de Contraseña (a implementar)'); return false;">
                ¿Olvidó su contraseña?
            </a>

        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
        </script>

    <script>
        // Función de validación de RUT REPLICADA
        function validarRUT(rutCompleto) {
            if (!rutCompleto) return false;
            rutCompleto = rutCompleto.replace(/[^0-9kK]/g, '').toUpperCase();
            if (rutCompleto.length < 2) return false;
            const cuerpo = rutCompleto.slice(0, -1);
            const dv = rutCompleto.slice(-1);
            if (!/^\d+$/.test(cuerpo)) return false;
            let suma = 0, multiplo = 2;
            for (let i = cuerpo.length - 1; i >= 0; i--) {
                suma += parseInt(cuerpo.charAt(i), 10) * multiplo;
                multiplo = multiplo < 7 ? multiplo + 1 : 2;
            }
            const resto = suma % 11;
            let dvEsperado = 11 - resto;
            if (dvEsperado === 11) dvEsperado = '0';
            else if (dvEsperado === 10) dvEsperado = 'K';
            else dvEsperado = String(dvEsperado);
            return dvEsperado === dv;
        }

        // Función de formato de RUT REPLICADA
        function formatRUT(rutInput) {
            let valorLimpio = rutInput.value.replace(/[^0-9kK]/g, '').toUpperCase();
            let rutFormateado = '';

            if (valorLimpio.length > 1) {
                let dv = valorLimpio.slice(-1);
                let cuerpo = valorLimpio.slice(0, -1);
                cuerpo = cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                rutFormateado = cuerpo + '-' + dv;
            } else {
                rutFormateado = valorLimpio;
            }

            rutInput.value = rutFormateado;

            // Validación visual usando Bootstrap
            if (valorLimpio.length >= 7) {
                if (validarRUT(valorLimpio)) {
                    rutInput.classList.remove('is-invalid');
                    rutInput.classList.add('is-valid');
                } else {
                    rutInput.classList.remove('is-valid');
                    rutInput.classList.add('is-invalid');
                }
            } else {
                rutInput.classList.remove('is-valid', 'is-invalid');
            }
        }


        // Lógica de Envío del Formulario (Validación con JS)
        document.getElementById('loginForm').addEventListener('submit', function (event) {
            event.preventDefault();
            const form = event.target;
            const usuarioInput = document.getElementById('usuario');
            const contrasenaInput = document.getElementById('contrasena');
            let isRUT = false;

            // 1. Aplicar formato al RUT (si el usuario ingresó un RUT)
            formatRUT(usuarioInput);

            // 2. Determinar si el campo es un RUT para validarlo
            // Usamos una simple heurística de largo para asumir que es un RUT
            const usuarioLimpio = usuarioInput.value.replace(/[^0-9kK]/g, '').toUpperCase();
            if (usuarioLimpio.length >= 7) {
                isRUT = true;
            }


            // 3. Validación de campos obligatorios de Bootstrap
            if (!form.checkValidity()) {
                event.stopPropagation();
                form.classList.add('was-validated');
                return;
            }

            // 4. Validación de RUT (si es un RUT)
            if (isRUT && !validarRUT(usuarioInput.value)) {
                usuarioInput.classList.remove('is-valid');
                usuarioInput.classList.add('is-invalid');
                alert('El RUT ingresado no es válido. Por favor, verifique.');
                return;
            } else if (isRUT) {
                usuarioInput.classList.remove('is-invalid');
                usuarioInput.classList.add('is-valid');
            } else if (usuarioInput.value.trim().length > 0) {
                // Si no es RUT, asumimos que es un nombre de usuario y lo validamos como válido si tiene contenido
                usuarioInput.classList.remove('is-invalid');
                usuarioInput.classList.add('is-valid');
            }

            // 5. Lógica de Autenticación (Simulada)
            // Aquí iría la llamada al backend real, pero simulamos una respuesta
            const usuario = usuarioInput.value;
            const contrasena = contrasenaInput.value;

            // Limpiar RUT para el envío final al backend (replicando la lógica de sanitización/limpieza)
            const usuarioParaEnvio = usuario.replace(/\./g, '').replace(/-/g, '');

            if (usuarioParaEnvio === "ADMIN12345678K" && contrasena === "passwordSeguro") {
                alert('✅ Acceso concedido. Redireccionando al dashboard...');
                // window.location.href = "dashboard.html"; 
            } else {
                alert('❌ Error de credenciales. Intente nuevamente.');
                // En un login real, es mejor NO indicar si el error es el usuario o la contraseña
            }

            form.classList.add('was-validated');
        });

        // Enlace del evento 'input' para el formato automático del RUT/Usuario
        document.addEventListener('DOMContentLoaded', function () {
            const usuarioInput = document.getElementById('usuario');
            if (usuarioInput) {
                usuarioInput.addEventListener('input', () => formatRUT(usuarioInput));
            }
        });
    </script>
</body>

</html>
