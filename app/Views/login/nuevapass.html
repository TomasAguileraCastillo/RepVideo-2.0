    <script type="text/javascript">
        // -------------------------------------------------------------
        // FUNCIONES DE SEGURIDAD Y VALIDACIÓN (REPLICADAS Y ADAPTADAS)
        // -------------------------------------------------------------

        // Función de Sanitización (Replicada del Login)
        function sanitizeInput(str) {
            if (!str) return '';
            let cleanStr = str.replace(/<script\b[^>]*>([\s\S]*?)<\/script>/gm, "")
                .replace(/<[^>]*>?/gm, "");
            cleanStr = cleanStr.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
            return cleanStr.trim();
        }

        function handleRestablecerSubmit(e) {
            e.preventDefault(); 
            const formulario = document.getElementById('frmNuevaClave');
            const nuevaClaveInput = document.getElementById('nueva_clave');
            const confirmarClaveInput = document.getElementById('confirmar_clave');
            
            // 1. Aplicar validación de Bootstrap (campo requerido y patrón de seguridad)
            if (!formulario.checkValidity()) {
                e.stopPropagation();
                formulario.classList.add('was-validated');
                return;
            }

            // 2. Validación de Coincidencia de Contraseñas (CRÍTICO)
            if (nuevaClaveInput.value !== confirmarClaveInput.value) {
                e.stopPropagation();
                // Desactivar validación de Bootstrap en el input correcto
                confirmarClaveInput.classList.add('is-invalid');
                confirmarClaveInput.classList.remove('is-valid');
                document.getElementById('confirmar-feedback').textContent = "Las contraseñas no coinciden.";
                
                // Mostrar alerta y detener el proceso
                alert('Las contraseñas ingresadas no coinciden. Por favor, verifique.');
                return;
            } else {
                // Si coinciden y pasan la validación de Bootstrap, marcamos como válidas
                confirmarClaveInput.classList.remove('is-invalid');
                confirmarClaveInput.classList.add('is-valid');
                document.getElementById('confirmar-feedback').textContent = "La confirmación de la contraseña es obligatoria."; // Vuelve al mensaje original
            }
            
            // 3. *** APLICAR SANITIZACIÓN ***
            // Aunque las claves no se sanitizan normalmente (se encriptan), limpiamos por si acaso.
            let nuevaClaveSanitizada = sanitizeInput(nuevaClaveInput.value);
            let confirmarClaveSanitizada = sanitizeInput(confirmarClaveInput.value);

            // 4. Lógica de Envío (Aquí se conectaría con tu backend PHP)
            
            // Simulación de proceso de restablecimiento:
            alert(`✅ Contraseña cambiada con éxito. Su nueva clave (encriptada) se enviará al servidor.\nClave: ${nuevaClaveSanitizada}`);
            
            // Redirigir al usuario al Login después de un restablecimiento exitoso:
            // window.location.href = "login.php?mensaje=clave_cambiada"; 
        }

        // -------------------------------------------------------------
        // ENLACE DE EVENTOS
        // -------------------------------------------------------------
        document.addEventListener('DOMContentLoaded', function () {
            const formulario = document.getElementById('frmNuevaClave');
            const nuevaClaveInput = document.getElementById('nueva_clave');
            const confirmarClaveInput = document.getElementById('confirmar_clave');

            if (formulario) {
                formulario.addEventListener('submit', handleRestablecerSubmit);
            }
            
            // Añadir un listener para validar la coincidencia en tiempo real (al perder el foco)
            confirmarClaveInput.addEventListener('blur', function() {
                 if (nuevaClaveInput.value !== confirmarClaveInput.value && confirmarClaveInput.value.length > 0) {
                     confirmarClaveInput.classList.add('is-invalid');
                     confirmarClaveInput.classList.remove('is-valid');
                     document.getElementById('confirmar-feedback').textContent = "Las contraseñas no coinciden.";
                 } else if (confirmarClaveInput.value.length >= 8 && nuevaClaveInput.value === confirmarClaveInput.value) {
                     confirmarClaveInput.classList.add('is-valid');
                     confirmarClaveInput.classList.remove('is-invalid');
                 }
            });
        });
    </script>
