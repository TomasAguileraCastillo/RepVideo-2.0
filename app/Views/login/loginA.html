    <script type="text/javascript">
        // -------------------------------------------------------------
        // FUNCIONES DE SEGURIDAD Y VALIDACIÓN (REPLICADAS)
        // -------------------------------------------------------------

        function validarRUT(rutCompleto) {
            if (!rutCompleto) return false;
            rutCompleto = rutCompleto.replace(/[^0-9kK]/g, '').toUpperCase();
            if (rutCompleto.length < 2) return false;
            const cuerpo = rutCompleto.slice(0, -1);
            const dv = rutCompleto.slice(-1);
            if (!/^\d+$/.test(cuerpo)) return false;
            let suma = 0,
                multiplo = 2;
            for (let i = cuerpo.length - 1; i >= 0; i--) {
                suma += parseInt(cuerpo.charAt(i), 10) * multiplo;
                multiplo = multiplo < 7 ? multiplo + 1 : 2;
            }
            const resto = suma % 11;
            let dvEsperado = 11 - resto;
            if (dvEsperado === 11) dvEsperado = '0';
            else if (dvEsperado === 10) dvEsperado = 'K';
            else dvEsperado = String(dvEsperado);
            return dvEsperado === dv;
        }

        function formatRUT(rutInput) {
            let valorLimpio = rutInput.value.replace(/[^0-9kK]/g, '').toUpperCase();
            let rutFormateado = '';

            const originalLength = rutInput.value.length;
            const originalCursor = rutInput.selectionStart;

            if (valorLimpio.length > 1) {
                let dv = valorLimpio.slice(-1);
                let cuerpo = valorLimpio.slice(0, -1);
                cuerpo = cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                rutFormateado = cuerpo + '-' + dv;
            } else {
                rutFormateado = valorLimpio;
            }

            rutInput.value = rutFormateado;

            // Lógica para mantener la posición del cursor
            const newLength = rutInput.value.length;
            const diff = newLength - originalLength;
            rutInput.selectionStart = rutInput.selectionEnd = originalCursor + diff;


            // Validación visual usando Bootstrap (para el campo de usuario)
            if (valorLimpio.length >= 7) {
                if (validarRUT(valorLimpio)) {
                    rutInput.classList.remove('is-invalid');
                    rutInput.classList.add('is-valid');
                    document.getElementById('login-feedback').textContent = "Usuario o RUT válido.";
                } else {
                    rutInput.classList.remove('is-valid');
                    rutInput.classList.add('is-invalid');
                    document.getElementById('login-feedback').textContent = "El RUT ingresado no es válido. Por favor, verifique.";
                }
            } else {
                // Si es corto, asumimos que puede ser un nombre de usuario normal, 
                // pero si no tiene valor, mostramos el error de obligatorio.
                rutInput.classList.remove('is-valid', 'is-invalid');
                document.getElementById('login-feedback').textContent = "El campo es obligatorio y/o el RUT no es válido.";
            }
        }

        function sanitizeInput(str) {
            if (!str) return '';
            // Función de sanitización para prevenir XSS
            let cleanStr = str.replace(/<script\b[^>]*>([\s\S]*?)<\/script>/gm, "")
                .replace(/<[^>]*>?/gm, "");
            cleanStr = cleanStr.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
            return cleanStr.trim();
        }

        function handleLoginSubmit(e) {
            const formulario = document.getElementById('frmAcceso');
            const loginInput = document.getElementById('loginacc');
            const claveInput = document.getElementById('claveacc');

            // 1. Forzar formato de RUT por si acaso
            formatRUT(loginInput);

            // 2. Aplicar validación de Bootstrap
            if (!formulario.checkValidity()) {
                e.preventDefault();
                e.stopPropagation();
                formulario.classList.add('was-validated');
                return;
            }

            // 3. Validación de RUT si el campo parece ser un RUT (largo >= 7)
            const loginLimpio = loginInput.value.replace(/[^0-9kK]/g, '').toUpperCase();
            if (loginLimpio.length >= 7 && !validarRUT(loginInput.value)) {
                e.preventDefault();
                alert('El RUT ingresado no es válido. Por favor, verifique.');
                return;
            }

            // 4. *** APLICAR SANITIZACIÓN ***
            claveInput.value = sanitizeInput(claveInput.value);
            loginInput.value = sanitizeInput(loginInput.value);

            // 5. *** LIMPIEZA FINAL DEL RUT PARA EL ENVÍO ***
            // Si el usuario ingresó un RUT, lo limpiamos para que el backend lo reciba sin puntos ni guiones
            if (loginLimpio.length >= 7) {
                loginInput.value = loginLimpio;
            }

            // 6. Si llegamos aquí, los datos están limpios y son válidos.
            // La función submit real al backend se ejecutará a continuación.
            // Si estás usando AJAX (común con JQuery que tienes incluido), aquí iría la llamada:
            // e.preventDefault();
            // loginAjax(loginInput.value, claveInput.value); 

            // Por ahora, solo alertamos del proceso de seguridad:
            alert(`✅ Datos listos para enviar al servidor:\n- Usuario/RUT: ${loginInput.value}\n- Contraseña: (sanitizada)`);
            // Nota: En un entorno real, se detiene el submit para usar AJAX
            e.preventDefault(); // Detener el envío para propósitos de prototipo/ejemplo
        }

        // -------------------------------------------------------------
        // ENLACE DE EVENTOS
        // -------------------------------------------------------------
        document.addEventListener('DOMContentLoaded', function () {
            const loginInput = document.getElementById('loginacc');
            const formulario = document.getElementById('frmAcceso');

            // Enlace de validación de formato (RUT/Usuario) al escribir
            if (loginInput) {
                loginInput.addEventListener('input', () => formatRUT(loginInput));
            }

            // Enlace de la función de manejo de envío del formulario
            if (formulario) {
                formulario.addEventListener('submit', handleLoginSubmit);
            }
        });
    </script>
