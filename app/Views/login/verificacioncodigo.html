    <script type="text/javascript">
        // -------------------------------------------------------------
        // FUNCIONES DE SEGURIDAD Y VALIDACIÓN (REPLICADAS Y ADAPTADAS)
        // -------------------------------------------------------------

        // Función de Sanitización (Replicada del Login)
        function sanitizeInput(str) {
            if (!str) return '';
            let cleanStr = str.replace(/<script\b[^>]*>([\s\S]*?)<\/script>/gm, "")
                .replace(/<[^>]*>?/gm, "");
            cleanStr = cleanStr.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
            return cleanStr.trim();
        }

        function handleVerificarSubmit(e) {
            e.preventDefault();
            const formulario = document.getElementById('frmVerificar');
            const codigoInput = document.getElementById('codigo_verificacion');

            // 1. Aplicar validación de Bootstrap (campo requerido y patrón)
            if (!formulario.checkValidity()) {
                e.stopPropagation();
                formulario.classList.add('was-validated');
                return;
            }

            // 2. *** APLICAR SANITIZACIÓN *** (Aunque es un campo numérico, es buena práctica)
            let codigo = sanitizeInput(codigoInput.value);

            // 3. Lógica de Envío (Aquí se conectaría con tu backend PHP)

            // Simulación de proceso de verificación:
            if (codigo === "123456") {
                alert('✅ Código Correcto. Redirigiendo a la creación de nueva contraseña...');
                // Si el código es correcto, redirigimos al paso 3:
                // window.location.href = "nueva_contrasena.php"; 
            } else {
                alert('❌ Código incorrecto o expirado. Intente nuevamente.');
                codigoInput.classList.add('is-invalid');
                document.getElementById('codigo-feedback').textContent = "El código es incorrecto o ha expirado.";
            }
        }

        function handleReenviar(e) {
            e.preventDefault();
            alert('Enviando nueva solicitud de código de verificación. Por favor, espere 60 segundos antes de intentar reenviar de nuevo.');
            // Aquí iría una llamada AJAX al backend para regenerar y enviar un nuevo código
        }


        // -------------------------------------------------------------
        // ENLACE DE EVENTOS
        // -------------------------------------------------------------
        document.addEventListener('DOMContentLoaded', function () {
            const formulario = document.getElementById('frmVerificar');

            if (formulario) {
                formulario.addEventListener('submit', handleVerificarSubmit);
            }
        });
    </script>
