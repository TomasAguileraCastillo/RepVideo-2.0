    <script type="text/javascript">
        // -------------------------------------------------------------
        // FUNCIONES DE SEGURIDAD Y VALIDACIÓN (REPLICADAS DEL LOGIN)
        // -------------------------------------------------------------

        // Replicamos las funciones de validación de RUT para asegurar consistencia
        function validarRUT(rutCompleto) {
            if (!rutCompleto) return false;
            rutCompleto = rutCompleto.replace(/[^0-9kK]/g, '').toUpperCase();
            if (rutCompleto.length < 2) return false;
            const cuerpo = rutCompleto.slice(0, -1);
            const dv = rutCompleto.slice(-1);
            if (!/^\d+$/.test(cuerpo)) return false;
            let suma = 0, multiplo = 2;
            for (let i = cuerpo.length - 1; i >= 0; i--) {
                suma += parseInt(cuerpo.charAt(i), 10) * multiplo;
                multiplo = multiplo < 7 ? multiplo + 1 : 2;
            }
            const resto = suma % 11;
            let dvEsperado = 11 - resto;
            if (dvEsperado === 11) dvEsperado = '0';
            else if (dvEsperado === 10) dvEsperado = 'K';
            else dvEsperado = String(dvEsperado);
            return dvEsperado === dv;
        }

        function formatRUT(rutInput) {
            let valorLimpio = rutInput.value.replace(/[^0-9kK]/g, '').toUpperCase();
            let rutFormateado = '';

            const originalLength = rutInput.value.length;
            const originalCursor = rutInput.selectionStart;

            if (valorLimpio.length > 1) {
                let dv = valorLimpio.slice(-1);
                let cuerpo = valorLimpio.slice(0, -1);
                cuerpo = cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                rutFormateado = cuerpo + '-' + dv;
            } else {
                rutFormateado = valorLimpio;
            }

            rutInput.value = rutFormateado;

            // Lógica para mantener la posición del cursor
            const newLength = rutInput.value.length;
            const diff = newLength - originalLength;
            rutInput.selectionStart = rutInput.selectionEnd = originalCursor + diff;


            // Validación visual usando Bootstrap 
            const feedbackElement = document.getElementById('usuario-feedback');

            if (valorLimpio.length >= 7) {
                if (validarRUT(valorLimpio)) {
                    rutInput.classList.remove('is-invalid');
                    rutInput.classList.add('is-valid');
                    feedbackElement.textContent = "Usuario o RUT válido.";
                } else {
                    rutInput.classList.remove('is-valid');
                    rutInput.classList.add('is-invalid');
                    feedbackElement.textContent = "El RUT ingresado no es válido. Por favor, verifique.";
                }
            } else if (rutInput.value.trim().length > 0) {
                 rutInput.classList.remove('is-invalid');
                 rutInput.classList.add('is-valid');
            } else {
                rutInput.classList.remove('is-valid', 'is-invalid');
                feedbackElement.textContent = "El campo es obligatorio y/o el RUT no es válido.";
            }
        }

        function sanitizeInput(str) {
            if (!str) return '';
            let cleanStr = str.replace(/<script\b[^>]*>([\s\S]*?)<\/script>/gm, "")
                .replace(/<[^>]*>?/gm, "");
            cleanStr = cleanStr.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
            return cleanStr.trim();
        }

        function handleRecuperarSubmit(e) {
            e.preventDefault(); 
            const formulario = document.getElementById('frmRecuperar');
            const usuarioInput = document.getElementById('recuperar_usuario');

            // 1. Forzar formato de RUT y validación visual
            formatRUT(usuarioInput);

            // 2. Aplicar validación de Bootstrap (campo requerido)
            if (!formulario.checkValidity()) {
                e.stopPropagation();
                formulario.classList.add('was-validated');
                return;
            }

            // 3. Validación de RUT si el campo parece ser un RUT (largo >= 7)
            const usuarioLimpio = usuarioInput.value.replace(/[^0-9kK]/g, '').toUpperCase();
            if (usuarioLimpio.length >= 7 && !validarRUT(usuarioInput.value)) {
                alert('El RUT ingresado no es válido. Por favor, verifique.'); 
                return;
            }

            // 4. *** APLICAR SANITIZACIÓN Y LIMPIEZA PARA EL ENVÍO ***
            let usuarioParaEnvio = sanitizeInput(usuarioInput.value);
            if (usuarioLimpio.length >= 7) {
                usuarioParaEnvio = sanitizeInput(usuarioLimpio); // Limpieza de puntos/guiones si es RUT
            }

            // 5. Lógica de Envío (Aquí se conectaría con tu backend PHP)
            
            // Simulación de proceso de envío de código:
            alert(`✅ Solicitud enviada para el usuario/RUT: ${usuarioParaEnvio}.\nSi la cuenta existe, recibirá un código de verificación en su correo electrónico.`);
            
            // Redirigir al usuario a una página de 'Ingresar Código' (Siguiente paso en el flujo)
            // window.location.href = "ingresar_codigo.php"; 
        }

        // -------------------------------------------------------------
        // ENLACE DE EVENTOS
        // -------------------------------------------------------------
        document.addEventListener('DOMContentLoaded', function () {
            const usuarioInput = document.getElementById('recuperar_usuario');
            const formulario = document.getElementById('frmRecuperar');

            // Enlace de validación de formato (RUT/Usuario) al escribir
            if (usuarioInput) {
                usuarioInput.addEventListener('input', () => formatRUT(usuarioInput));
                usuarioInput.addEventListener('blur', () => formatRUT(usuarioInput)); 
            }

            // Enlace de la función de manejo de envío del formulario
            if (formulario) {
                formulario.addEventListener('submit', handleRecuperarSubmit);
            }
        });
    </script>
